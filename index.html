<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTA Live Equalizer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 780px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #00e0ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle { font-size: 13px; color: #888; margin-bottom: 22px; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        input[type="text"]:focus { border-color: #00e0ff; }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(90deg, #00e0ff, #a855f7);
            color: #000;
            width: 100%;
            margin-top: 14px;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,224,255,0.3); }
        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.14); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .section h2 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 14px;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section h2::before {
            content: '';
            width: 4px; height: 16px;
            background: linear-gradient(180deg, #00e0ff, #a855f7);
            border-radius: 2px;
        }

        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }

        .slider-group {
            background: rgba(0,0,0,0.25);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .slider-group label { margin-bottom: 8px; font-size: 11px; }
        .slider-value {
            float: right;
            color: #00e0ff;
            font-weight: 600;
            font-size: 12px;
        }
        input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px; height: 16px;
            background: linear-gradient(135deg, #00e0ff, #a855f7);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0,224,255,0.5);
        }

        #player {
            width: 100%;
            margin-top: 16px;
            border-radius: 10px;
            background: #000;
        }

        .result {
            margin-top: 18px;
            padding: 14px;
            background: rgba(0,224,255,0.06);
            border: 1px solid rgba(0,224,255,0.2);
            border-radius: 10px;
            display: none;
        }
        .result.show { display: block; }
        .result-label { font-size: 11px; color: #00e0ff; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; }
        .result-url {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 6px;
            word-break: break-all;
            color: #7df9ff;
        }
        .btn-copy {
            margin-top: 10px;
            padding: 8px 16px;
            font-size: 12px;
            background: rgba(0,224,255,0.15);
            color: #00e0ff;
            border: 1px solid rgba(0,224,255,0.3);
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-copy:hover { background: rgba(0,224,255,0.25); }

        .status {
            margin-top: 12px;
            font-size: 12px;
            color: #888;
            text-align: center;
            min-height: 16px;
        }
        .status.error { color: #ff5c5c; }
        .status.loading { color: #ffcc00; }
        .status.success { color: #00ff88; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎧 MTA Live Equalizer</h1>
        <p class="subtitle">Cole um link do YouTube / YouTube Music e ajuste o som</p>

        <label for="url">URL do YouTube / YouTube Music</label>
        <input type="text" id="url" placeholder="https://youtube.com/watch?v=... ou nome da música">

        <div class="section">
            <h2>Equalizador</h2>
            <div class="grid-3">
                <div class="slider-group">
                    <label>Bass <span class="slider-value" id="val-bass">0</span></label>
                    <input type="range" id="bass" min="-10" max="20" value="0" step="0.5">
                </div>
                <div class="slider-group">
                    <label>Mid <span class="slider-value" id="val-mid">0</span></label>
                    <input type="range" id="mid" min="-10" max="10" value="0" step="0.5">
                </div>
                <div class="slider-group">
                    <label>Treble <span class="slider-value" id="val-treble">0</span></label>
                    <input type="range" id="treble" min="-10" max="10" value="0" step="0.5">
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Bass Booster</h2>
            <div class="grid-2">
                <div class="slider-group">
                    <label>Intensidade <span class="slider-value" id="val-bassboost">0</span></label>
                    <input type="range" id="bassboost" min="0" max="30" value="0" step="0.5">
                </div>
                <div class="slider-group">
                    <label>Anti-distorção <span class="slider-value" id="val-anti">70</span></label>
                    <input type="range" id="anti" min="0" max="100" value="70" step="1">
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Reverb / Ambiente</h2>
            <div class="grid-2">
                <div class="slider-group">
                    <label>Tipo <span class="slider-value" id="val-reverb-type">Off</span></label>
                    <select id="reverb-type" style="width:100%; padding:8px; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.1); border-radius:6px; color:#fff;">
                        <option value="off">Desligado</option>
                        <option value="small">Sala pequena</option>
                        <option value="hall">Hall</option>
                        <option value="church">Igreja</option>
                        <option value="stadium">Estádio</option>
                    </select>
                </div>
                <div class="slider-group">
                    <label>Mix <span class="slider-value" id="val-reverbmix">0</span></label>
                    <input type="range" id="reverbmix" min="0" max="100" value="0" step="1">
                </div>
            </div>
        </div>

        <button class="btn btn-primary" id="btn-play" onclick="playAudio()">▶ Tocar Preview</button>

        <audio id="player" controls></audio>

        <div class="section">
            <h2>Link para o MTA</h2>
            <button class="btn btn-secondary" id="btn-generate" onclick="generateMtaLink()" style="width:100%;">
                🔗 Gerar Link setradio
            </button>

            <div class="result" id="result">
                <div class="result-label">Seu link para o MTA:SA</div>
                <div class="result-url" id="result-url"></div>
                <button class="btn-copy" onclick="copyLink()">📋 Copiar</button>
            </div>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script>
        // ============ SLIDERS ============
        const sliders = ['bass', 'mid', 'treble', 'bassboost', 'anti', 'reverbmix'];
        sliders.forEach(id => {
            const el = document.getElementById(id);
            const val = document.getElementById('val-' + id);
            el.addEventListener('input', () => { val.textContent = el.value; });
        });

        const reverbType = document.getElementById('reverb-type');
        reverbType.addEventListener('change', () => {
            document.getElementById('val-reverb-type').textContent = reverbType.options[reverbType.selectedIndex].text;
        });

        // ============ MONTAR QUERY STRING ============
        function buildParams() {
            return new URLSearchParams({
                bass: document.getElementById('bass').value,
                mid: document.getElementById('mid').value,
                treble: document.getElementById('treble').value,
                bassboost: document.getElementById('bassboost').value,
                anti: document.getElementById('anti').value,
                reverb: document.getElementById('reverb-type').value,
                reverbmix: document.getElementById('reverbmix').value,
            }).toString();
        }

        function setStatus(msg, type = '') {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status ' + type;
        }

        // ============ PREVIEW ============
        function playAudio() {
            const url = document.getElementById('url').value.trim();
            if (!url) {
                setStatus('Cole uma URL primeiro.', 'error');
                return;
            }
            const params = buildParams();
            const streamUrl = `/stream?url=${encodeURIComponent(url)}&${params}`;
            const player = document.getElementById('player');
            player.src = streamUrl;
            player.play().catch(e => setStatus('Erro ao tocar: ' + e.message, 'error'));
            setStatus('🎵 Tocando preview...', 'loading');
        }

        // ============ GERAR LINK MTA ============
        async function generateMtaLink() {
            const url = document.getElementById('url').value.trim();
            if (!url) {
                setStatus('Cole uma URL primeiro.', 'error');
                return;
            }

            const btn = document.getElementById('btn-generate');
            btn.disabled = true;
            setStatus('⏳ Criando stream para o MTA...', 'loading');

            try {
                const params = buildParams();
                const res = await fetch(`/api/create-stream?url=${encodeURIComponent(url)}&${params}`);
                const data = await res.json();

                if (data.stream_url) {
                    document.getElementById('result-url').textContent = data.stream_url;
                    document.getElementById('result').classList.add('show');
                    setStatus('✅ Link gerado! Cole no MTA.', 'success');
                } else {
                    setStatus('❌ Erro: ' + (data.error || 'desconhecido'), 'error');
                }
            } catch (e) {
                setStatus('❌ Erro: ' + e.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        // ============ COPIAR LINK ============
        function copyLink() {
            const text = document.getElementById('result-url').textContent;
            navigator.clipboard.writeText(text).then(() => {
                setStatus('📋 Link copiado!', 'success');
            });
        }
    </script>
</body>
</html>
